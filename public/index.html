<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="description" content="Sketchbeast turns your photo into a dreamy collage of random shapes. Use it to spice up your profile pic, create a background, or turn vacation shots into art.">
    <title>sketchbeast: turn photos into art</title>
      <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
      <script src="js/beast.js"></script>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
      <link rel="stylesheet" href="css/sketchbeast.css">
  </head>
  <body>
    <div class="container-fluid h-100" style="background-color: #1c1c1c;">
      <div class="h-100 d-flex flex-column">
        <div class="row d-block" id="settings">
          <div class="col">
            <form id="mainform" method="post" enctype="multipart/form-data">
              <input type="file" id="fileinput" name="image" accept="image/*" />
              <input type="hidden" id="svgsrc" />
              <p><span class="clause">sketchbeast
              <span id="mood"></span>
              <span class="beforetext">will use
              <label for="fileinput" class="button" id="fileupload">your uploaded file</label></span></span>
              <span class="clause"><span class="beforetext">to make a</span><span class="duringtext">is making a</span>
              <select name="blur" id="blur">
                <option value="0">crystal clear</option>
                <option value="1" selected>dreamy</option>
                <option value="2">blurry</option>
              </select>
              collage</span><br /> <span class="clause"> of
              <span class="beforetext"><input type="number" id="count" min="3" max="150" value="15"></span>
              <span class="duringtext" id="currentcount">some</span> semi-random
                <select name="mode" id="mode">
                  <option value="0">mixed shapes</option>
                  <option value="1">rectangles</option>
                  <option value="2">triangles</option>
                  <option value="3">ellipses</option>
                  <option value="4">polygons</option>
                  <option value="5">squiggles</option>
                </select>
              </span>
              <span class="beforetext clause">when you press <input type="button" value="this button" id="process" /></span>
              <span class="spinner-grow bluu duringtext" role="status"><span class="sr-only"></span></span>
              </p>
            </form>
        </div>
        </div>

        <div id="workpane" class="row flex-grow-1 align-items-center justify-items-center overflow-auto">
          <div class="col-6" id="input"><img alt="Before Image" src="images/before.jpg" /></div>
          <div class="col-6" id="output"><img alt="After Image" src="images/after.svg" /></div>
        </div>

        <div class="row flex-nowrap" id="thumbnails"></div>
      </div>
    </div> 

    <script>

(function(){
  function previewImage(file) {
      var input = document.getElementById("input");
      var imageType = /image.*/;

      if (!file.type.match(imageType)) {
          throw "File Type must be an image";
      }

      var img = document.createElement("img");
      img.file = file;
      input.innerHTML = "";
      input.append(img);

      var reader = new FileReader();
      reader.onload = (function(aImg) { return function(e) { aImg.src = e.target.result; }; })(img);
      reader.readAsDataURL(file);
      updateImageSize();

  }

  function changemood(newmood) {
    var mood = document.getElementById("mood");
    switch (newmood) {
      case 0:
        mood.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-emoji-smile-fill" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zM7 6.5C7 7.328 6.552 8 6 8s-1-.672-1-1.5S5.448 5 6 5s1 .672 1 1.5zM4.285 9.567a.5.5 0 0 1 .683.183A3.498 3.498 0 0 0 8 11.5a3.498 3.498 0 0 0 3.032-1.75.5.5 0 1 1 .866.5A4.498 4.498 0 0 1 8 12.5a4.498 4.498 0 0 1-3.898-2.25.5.5 0 0 1 .183-.683zM10 8c.552 0 1-.672 1-1.5S10.552 5 10 5s-1 .672-1 1.5S9.448 8 10 8z"/></svg>';
        break;
      case 1:
        mood.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-emoji-neutral-fill" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zM7 6.5C7 7.328 6.552 8 6 8s-1-.672-1-1.5S5.448 5 6 5s1 .672 1 1.5zm-3 4a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zM10 8c.552 0 1-.672 1-1.5S10.552 5 10 5s-1 .672-1 1.5S9.448 8 10 8z"/></svg>';
        break;
      case 2:
        mood.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-emoji-expressionless-fill" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zM4.5 6a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1h-2zm5 0a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1h-2zm-5 4a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1h-7z"/></svg>';
        break;
      case 3:
        mood.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-emoji-frown-fill" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zM7 6.5C7 7.328 6.552 8 6 8s-1-.672-1-1.5S5.448 5 6 5s1 .672 1 1.5zm-2.715 5.933a.5.5 0 0 0 .683-.183A3.498 3.498 0 0 1 8 10.5c1.295 0 2.426.703 3.032 1.75a.5.5 0 0 0 .866-.5A4.498 4.498 0 0 0 8 9.5a4.5 4.5 0 0 0-3.898 2.25.5.5 0 0 0 .183.683zM10 8c.552 0 1-.672 1-1.5S10.552 5 10 5s-1 .672-1 1.5S9.448 8 10 8z"/></svg>';
        break;
      case 4:
        mood.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-emoji-angry-fill" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zM4.053 4.276a.5.5 0 0 1 .67-.223l2 1a.5.5 0 0 1 .166.76c.071.206.111.44.111.687C7 7.328 6.552 8 6 8s-1-.672-1-1.5c0-.408.109-.778.285-1.049l-1.009-.504a.5.5 0 0 1-.223-.67zm.232 8.157a.5.5 0 0 0 .683-.183A3.498 3.498 0 0 1 8 10.5c1.295 0 2.426.703 3.032 1.75a.5.5 0 1 0 .866-.5A4.498 4.498 0 0 0 8 9.5a4.5 4.5 0 0 0-3.898 2.25.5.5 0 0 0 .183.683zM10 8c.552 0 1-.672 1-1.5 0-.408-.109-.778-.285-1.049l1.009-.504a.5.5 0 1 0-.448-.894l-2 1a.5.5 0 0 0-.165.76A2.12 2.12 0 0 0 9 6.5c0 .828.448 1.5 1 1.5z"/></svg>';
        break;
      case 5:
        mood.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-emoji-dizzy-fill" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path fill-rule="evenodd" d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zM4.146 5.146a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 1 1 .708.708l-.647.646.647.646a.5.5 0 1 1-.708.708L5.5 7.207l-.646.647a.5.5 0 1 1-.708-.708l.647-.646-.647-.646a.5.5 0 0 1 0-.708zm5 0a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 0 1 .708.708l-.647.646.647.646a.5.5 0 0 1-.708.708l-.646-.647-.646.647a.5.5 0 1 1-.708-.708l.647-.646-.647-.646a.5.5 0 0 1 0-.708zM8 13a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>';
        break;
    }
  }

  function addThumbnail() {
    var svgsrc = document.getElementById("svgsrc").value;
    var blob = new Blob([svgsrc], {type: 'image/svg+xml'});
    var url = URL.createObjectURL(blob);

    var thumbnail = document.createElement('img');
    thumbnail.src = url;
    thumbnail.id = makeid(5);
    thumbnail.className = "thumbnail";

    var downloadbutton = document.createElement('button');
    downloadbutton.classList.add("btn");
    downloadbutton.innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" class="bi bi-download" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"></path><path fill-rule="evenodd" d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"></path></svg>';
    
    var downloadspan = document.createElement('div');
    downloadspan.className = "download";
    downloadspan.appendChild(downloadbutton);

    var gallery = document.getElementById("thumbnails");
    gallery.prepend(downloadspan);
    gallery.prepend(thumbnail);

    var image = document.createElement('img');
    image.src = url;

    var output = document.getElementById("output");
    output.innerHTML = "";
    output.append(image);

    updateImageSize();
    stopProcessing();
  }

  function process(file){
    url = URL.createObjectURL(file);

    var targetnodes = {
      output: document.querySelector("#output"),
      svgsrc: document.querySelector("#svgsrc")
    }

    var steps = document.getElementById('count').value;
    var mode = document.getElementById('mode').value;
    var blur = document.getElementById('blur').value;

    var config = {
      computeSize: 500,
      viewHeight: $("#workpane").height(),
      viewWidth: ($("#workpane").width() / 2) - 40,
      steps: parseInt(steps),
      mode: parseInt(mode),
      blur: parseInt(blur),
      shapes: 200,
      alpha: 0.5,
      mutations: 30,
      mutateAlpha: false,
      fill: 'auto',
      nodes: targetnodes
    }

    var beast = new Beast(config);
    beast.load(url).then(original => beast.begin(original));
    startProcessing();
  }

  function downloadURL(url, name = 'file.txt') {
    const link = document.createElement("a");
    link.href = url;
    link.download = name;

    document.body.appendChild(link);

    link.dispatchEvent(
      new MouseEvent('click', { 
        bubbles: true, 
        cancelable: true, 
        view: window 
      })
    );

    document.body.removeChild(link);
  }

  function makeid(length) {
    var result = '';
    var characters = 'abcdefghijklmnopqrstuvwxyz0123456789';
    var charactersLength = characters.length;
    for ( var i = 0; i < length; i++ ) {
      result += characters.charAt(Math.floor(Math.random() * charactersLength));
    }
    return result;
  }

  document.querySelector('#fileinput').addEventListener('change', function () {
      for(var i=0; i<this.files.length; i++){
          previewImage(this.files[i]); 
      }
  }, false);

  document.getElementById('process').addEventListener('click', function () {
      var files = document.querySelector('#fileinput').files;
      for(var i=0; i<files.length; i++){
          process(files[i]);
      }
  }, false);

  document.getElementById('count').addEventListener('change', function () {
    if (this.value > 150) { this.value = 150; this.style.width = '113px'; }
    if (this.value < 3) { this.value = 3; this.style.width = '96px'; }
  }, false);

  document.getElementById('count').addEventListener('input', function () {  
    if (this.value.length == 0) { this.style.width = '51px'}  
    if (this.value.length == 1) { this.style.width = '77px'}  
    if (this.value.length == 2) { this.style.width = '96px'}  
    if (this.value.length == 3) { this.style.width = '113px'}  
    if (this.value.length > 3) { this.value = 150; this.style.width = '113px'}
  }, false);


  $(document).ready(function () {
    updateImageSize();
    stopProcessing();

    changemood(0);

    $(window).keydown(function(event){
      if(event.keyCode == 13) {
        event.preventDefault();
        return false;
      }
    });
  });

  $(window).resize(function() {
    updateImageSize();
  });

  $('body').on('click', '.download', function (){
    downloadURL($(this).prev().attr('src'), "beast-" + $(this).prev().attr('id') + ".svg");
  });

  $('body').on('click', '.thumbnail', function (){
    var image = document.createElement('img');
    image.src = this.src;

    var height = $("#workpane").height();

    var output = document.getElementById("output");
    output.innerHTML = "";
    output.append(image);

    $("#output").find("img").css("max-height", height);
  });

  $("#output").change(function() { updateImageSize()});

  document.getElementById('output').addEventListener('beast', function () {
    addThumbnail();
  }, false);

  document.getElementById('output').addEventListener('shape', function (e) {
    if (e.detail.stepsremaining > 0) {

      var mood;
      if (e.detail.badsteps > 100) { changemood(5); } 
      if (e.detail.badsteps > 80) { changemood(4); } 
      else if (e.detail.badsteps > 50) { changemood(3); } 
      else if (e.detail.badsteps > 10) { changemood(2); } 
      else if (e.detail.badsteps > 2) { changemood(1); } 
      else { changemood(0); }

      var count = document.getElementById("currentcount");
      count.innerHTML = e.detail.stepsremaining;
    }
    updateImageSize();
  }, false);

  function startProcessing() {
    $(".beforetext").hide();
    $(".duringtext").show();
  }

  function stopProcessing() {
    $(".beforetext").show();
    $(".duringtext").hide();
  }

  function updateImageSize() {
    var height = $("#workpane").height();
    $("#output").find("img").css("max-height", height);
    $("#output").find("svg").css("max-height", height);
    $("#input").find("img").css("max-height", height);
  }

  $('select').change(function(){
    var text = $(this).find('option:selected').text();
    var $aux = $('<select/>').append($('<option/>').text(text));
    $(this).after($aux);
    $(this).width($aux.width());
    $aux.remove();
  }).change();

  $('body').on('mouseover', '.thumbnail, .download', function () {
    if ($(this).attr('class') == "thumbnail") {
      $(this).next().show();
    } else {
      $(this).show();
    }
  });

  $('body').on('mouseleave', '.thumbnail, .download', function () {
    if ($(this).attr('class') == "thumbnail") {
      $(this).next().hide();
    } else {
      $(this).hide();
    }
  });

})();

    </script>
  </body>
</html>
